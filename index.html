<!DOCTYPE html>
<html lang="zh-TW" data-style="classic" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2c2f33">
    <title>Simple Clock</title>
    <link rel="icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="icon/icon-512x512.png">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&family=Roboto+Mono:wght@300;400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script>
        try {
            const s = localStorage.getItem('clockStyle');
            const m = localStorage.getItem('themeMode');
            const r = document.documentElement;
            if (s === 'glass') r.dataset.style = 'glass';
            if (localStorage.getItem('showDigital') === 'false') r.dataset.digital = 'off';
            const dark = matchMedia('(prefers-color-scheme: dark)').matches;
            r.dataset.theme = m === 'light' || m === 'dark' ? m : (dark ? 'dark' : 'light');
        } catch { }
    </script>
</head>

<body>
    <svg class="lg-defs" aria-hidden="true">
        <defs id="lg-defs"></defs>
    </svg>

    <div class="scene" aria-hidden="true">
        <div class="glow"></div>
        <div class="grid"></div>
    </div>

    <div class="dock glass" id="dock" data-lg="pill">
        <div class="seg" id="theme-seg" role="radiogroup" aria-label="外觀主題">
            <span class="seg-thumb"></span>
            <span class="tip-wrap">
                <button class="seg-btn" data-mode="light" role="radio" aria-label="淺色">
                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="4"></circle>
                        <path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"></path>
                    </svg>
                </button>
                <span class="tip">淺色</span>
            </span>
            <span class="tip-wrap">
                <button class="seg-btn" data-mode="auto" role="radio" aria-label="跟隨系統">
                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="8.5"></circle>
                        <path class="fill" d="M12 3.5a8.5 8.5 0 0 1 0 17z"></path>
                    </svg>
                </button>
                <span class="tip">跟隨系統</span>
            </span>
            <span class="tip-wrap">
                <button class="seg-btn" data-mode="dark" role="radio" aria-label="深色">
                    <svg viewBox="0 0 24 24">
                        <path d="M20 14.6A8.5 8.5 0 0 1 9.4 4a8.5 8.5 0 1 0 10.6 10.6z"></path>
                    </svg>
                </button>
                <span class="tip">深色</span>
            </span>
        </div>
        <span class="dock-divider"></span>
        <span class="tip-wrap wrap-style">
            <button id="style-btn" class="top-btn" aria-label="切換成指針時鐘">
                <svg class="ico-glass" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="9"></circle>
                    <path d="M12 7v5l3 2"></path>
                </svg>
                <svg class="ico-classic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2.5" y="6" width="19" height="12" rx="3"></rect>
                    <path d="M7 10v4M10.5 10v4M12.6 11h.01M12.6 13h.01M14.5 10h2.5v4h-2.5z"></path>
                </svg>
            </button>
            <span class="tip tip-align-end" id="style-tip">切換成指針時鐘</span>
        </span>
        <span class="tip-wrap wrap-gear">
            <button id="settings-btn" class="top-btn gear" aria-label="設定">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path
                        d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
                    </path>
                </svg>
            </button>
            <span class="tip tip-align-end">設定</span>
        </span>
    </div>

    <div class="app-container">
        <div class="clock-box" id="clock-box">
            <div class="date-display" id="date">Loading...</div>
            <div class="time-display">
                <span id="time">00:00:00</span>
                <span id="ampm"></span>
            </div>
        </div>
    </div>

    <main class="glass-stage">
        <div class="watch" id="watch" role="img" aria-label="指針時鐘">
            <div class="w-ring" data-lg="ring"></div>
            <div class="w-dial"></div>
            <div class="w-sweep" id="w-sweep"></div>
            <svg class="w-face" id="w-face" viewBox="-100 -100 200 200" aria-hidden="true"></svg>
            <div class="w-info">
                <span class="w-digital"><span id="w-time">00:00:00</span><span class="w-ampm" id="w-ampm"></span></span>
            </div>
            <div class="w-hands">
                <div class="hand h-hour" id="h-hour"></div>
                <div class="hand h-min" id="h-min"></div>
                <div class="hand h-sec" id="h-sec"></div>
                <div class="w-cap"></div>
            </div>
        </div>
    </main>

    <div id="settings-modal" class="modal-overlay">
        <div class="modal-content glass" data-lg="sheet">
            <div class="modal-header">
                <h2>設定</h2>
                <button id="modal-close-btn">&times;</button>
            </div>

            <div class="settings-group">
                <div class="setting-item">
                    <label>時鐘樣式</label>
                    <div class="choice" id="style-choice" role="radiogroup" aria-label="時鐘樣式">
                        <button class="choice-btn" data-style="classic" role="radio">經典數字</button>
                        <button class="choice-btn" data-style="glass" role="radio">指針時鐘</button>
                    </div>
                </div>

                <div class="setting-item">
                    <label>時區 (UTC)</label>
                    <div class="stepper-container">
                        <button id="utc-dec" class="step-btn">-</button>
                        <input type="text" id="utc-display" value="+8" readonly>
                        <button id="utc-inc" class="step-btn">+</button>
                    </div>
                    <input type="number" id="utc-input" style="display: none;" min="-12" max="14" step="1">
                </div>

                <div class="setting-item">
                    <label>時間顯示格式</label>
                    <label class="switch-label">
                        <input type="checkbox" id="format-toggle">
                        <span class="slider"></span>
                        <span class="label-text">24小時制</span>
                    </label>
                </div>

                <div class="setting-item" id="digital-item">
                    <label>錶面數字時間</label>
                    <label class="switch-label">
                        <input type="checkbox" id="digital-toggle">
                        <span class="slider"></span>
                        <span class="label-text" id="digital-text">顯示</span>
                    </label>
                </div>

                <div class="setting-item">
                    <label>時鐘放縮率</label>
                    <div class="slider-container">
                        <input type="range" id="scale-slider" min="0.5" max="2.0" step="0.1" value="1.0">
                        <span id="scale-value">1.0x</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="aki-footer">Made by Aki</div>

    <script src="script.js"></script>
</body>

</html>
